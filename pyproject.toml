[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spectre"
version = "0.1.0"
description = "SPEctral Classifier for Talker REcognition — speaker identification from voice spectra"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]
